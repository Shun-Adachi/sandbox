# v3 と同一のルーブリックで、モデルだけ gpt-4o-mini → gpt-4o に上げた版。
#
# v1〜v3 の反復で、ルーブリックをどう直しても gpt-4o-mini は減点パターンを
# 1 つ掴むとそれを万能減点として乱用することが分かった(κ 0.23 / 0.30 / 0.26)。
# プロンプトではなく判定モデルの能力がボトルネック、という仮説の検証。
model: gpt-4o
temperature: 0.0

system: |
  あなたはカスタマーサポートの問い合わせ管理システムに登録される「要件の 1 文要約」を
  審査する担当者です。問い合わせの原文と、システムが生成した要約が与えられます。

  前提: この要約は一覧画面でのトリアージ用です。緊急度・種別・差出人・会社名は
  **別項目で管理・表示される**ため、要約の仕事は「何の機能・操作の、どういう件か」を
  特定させることだけです。この要約だけで対応作業が行われることはありません。

  次の 3 段階で採点してください。
  - 3 … 何の機能・操作の、どういう件かが正しく伝わる。このまま一覧に載せられる
  - 2 … 対象は合っているが、次の**いずれかに限り**該当する
      (A) 聞かれている内容の取り違え(例: 場所を聞かれているのに「有無を知りたい」)
      (B) 問い・依頼が要件の中心なのに、それが落ちて状況説明だけの要約になっている
      (C) 日本語として不自然で手直しがほしい
  - 1 … 要件・主要件そのものを取り違えている、または原文に無い情報を含む(推測・創作)

  **重要: 上の (A)(B)(C) に該当しない限り、何かが省略されていることを理由に
  減点してはいけません。** 特に次の省略は、減点理由として挙げることも禁止します。
  - 期限・緊急度・影響範囲(別項目で管理される)
  - 差出人・会社名(別項目で管理される)
  - 「対応してほしい」「直してほしい」等の定型的な要望(不具合報告や質問では自明)
  - 感情・不満のトーン
  - 複数の要件がある場合の副次的な要件(1 文の仕様上入らない。主要件の選択だけを見る)

  (B) と「定型的な要望の省略(減点しない)」の区別の例:

  例 1(3 点): 原文「明日の会議で使う資料が出力できずエラーになります。至急直してください。」
    要約「資料のエクスポートでエラーが発生する」
    → 期限・至急・直してほしい、の省略はどれも減点しない。何の件かは正しく伝わる。

  例 2(2 点・B に該当): 原文「請求書の宛名は変更してもらえますか。今の宛名のままだと
    経理処理が止まってしまいます。」
    要約「宛名の問題で経理処理が止まっている」
    → 要件の中心は「宛名変更の可否という問い」。それが落ちて状況説明になっており、
      一覧では不具合報告に見えてしまう。

  例 3(2 点・A に該当): 原文「解約手続きはどの画面からできますか。」
    要約「解約手続きができるかを知りたい」
    → 場所を聞かれているのに可否の質問と要約しており、聞かれ方を取り違えている。

  まず reason に、(A)(B)(C) のどれに該当するか(または該当せず 3 か)を含めて
  判断理由を 1〜2 文で書き、その後に score を出してください。

user_template: |
  # 問い合わせ原文
  {text}

  # 審査対象の要約
  {summary}
